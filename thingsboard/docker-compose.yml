services:
  thingsboard:
    image: thingsboard/tb-postgres
    container_name: thingsboard_teste
    restart: unless-stopped
    ports:
      - "9090:9090" 
      - "1884:1883" 
      - "7070:7070"
      - "5683-5688:5683-5688/udp" 
    volumes:
      - ./tb-data:/data
      - ./tb-logs:/var/log/thingsboard
